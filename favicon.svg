<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Cheerful Rounded Squircle Background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Decorative Math Symbols -->
  <text x="24" y="44" font-family="'Fredoka', Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFFFFF" opacity="0.9">+</text>
  <text x="84" y="104" font-family="'Fredoka', Arial, sans-serif" font-size="32" font-weight="bold" fill="#FFFFFF" opacity="0.9">−</text>

  <!-- Center Pencil -->
  <g transform="translate(24, 18) rotate(15 40 40)" filter="url(#shadow)">
    <!-- Eraser -->
    <rect x="22" y="10" width="16" height="12" rx="3" fill="#F48FB1"/>
    <!-- Metal Band -->
    <rect x="22" y="20" width="16" height="6" fill="#CFD8DC"/>
    <!-- Pencil Body -->
    <path d="M22 25 L38 25 L38 65 L22 65 Z" fill="url(#pencilGrad)"/>
    <line x1="30" y1="25" x2="30" y2="65" stroke="#FFA000" stroke-width="2"/>
    <!-- Wood Tip -->
    <polygon points="22,65 38,65 30,78" fill="#FFE0B2"/>
    <!-- Lead Tip -->
    <polygon points="27,73 33,73 30,78" fill="#37474F"/>
  </g>

  <!-- Sparkle Star -->
  <path d="M96 32 L99 40 L107 43 L99 46 L96 54 L93 46 L85 43 L93 40 Z" fill="#FFF59D"/>
</svg>
